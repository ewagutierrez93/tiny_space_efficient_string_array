[project]
name = "tiny-space-efficient-string-array"
version = "0.1.1"
description = "Concatenates string elements into one buffer with boundary tracking for iteration and indexed access without per-element str objects."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
